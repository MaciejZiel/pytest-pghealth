name: Real projects

# Runs every check against the migrated schemas of open-source projects
# (docs/real-projects.md). Manual or from realworld/* branches only: the
# repository is private and Actions minutes are limited.
on:
  workflow_dispatch:
  push:
    branches: ["realworld/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [fastapi-template, prefect, netbox, wagtail]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGPASSWORD: pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Migrate ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euxo pipefail
          psql -h localhost -U postgres -c "create database project"
          work="$RUNNER_TEMP/work"
          mkdir -p "$work"
          # outside this checkout, so its [tool.uv] exclude-newer does not apply
          cd "$work"
          # the project at a pinned commit, so the results in docs/real-projects.md reproduce
          fetch() {
            git init -q "$work/src"
            git -C "$work/src" fetch -q --depth 1 "$1" "$2"
            git -C "$work/src" checkout -q FETCH_HEAD
          }
          # dependencies as they were on the day of docs/real-projects.md
          # (the FastAPI template has its own uv.lock)
          pinned="--exclude-newer 2026-11-15T17:00:00Z"
          case "$PROJECT" in
            fastapi-template)
              fetch https://github.com/fastapi/full-stack-fastapi-template aabb90126964a164e02aff39e7c385bb0598236d
              cd "$work/src/backend"
              export DATABASE_URL=postgresql://postgres:pg@localhost:5432/project
              export UV_PYTHON=3.14
              uv sync --locked
              uv run alembic upgrade head
              ;;
            prefect)
              uv venv "$work/venv" -p 3.12
              uv pip install $pinned --python "$work/venv" prefect==3.9.3
              uv pip show --python "$work/venv" prefect | head -2
              export PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://postgres:pg@localhost:5432/project
              "$work/venv/bin/prefect" server database upgrade -y
              ;;
            netbox)
              fetch https://github.com/netbox-community/netbox 2ac39b5da75d4b83cbb14a0c3307f1839cc65ac6
              uv venv "$work/venv" -p 3.12
              sed -E 's/psycopg\[c,pool\]/psycopg[binary,pool]/' "$work/src/requirements.txt" > "$work/requirements.txt"
              uv pip install $pinned --python "$work/venv" -r "$work/requirements.txt"
              cat > "$work/src/netbox/netbox/configuration.py" <<'PY'
          ALLOWED_HOSTS = ["*"]
          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.postgresql",
                  "NAME": "project",
                  "USER": "postgres",
                  "PASSWORD": "pg",
                  "HOST": "localhost",
                  "PORT": "",
              }
          }
          REDIS = {
              "tasks": {"HOST": "localhost", "PORT": 6379, "USERNAME": "", "PASSWORD": "", "DATABASE": 0, "SSL": False},
              "caching": {"HOST": "localhost", "PORT": 6379, "USERNAME": "", "PASSWORD": "", "DATABASE": 1, "SSL": False},
          }
          SECRET_KEY = "realworld-trial-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz"
          API_TOKEN_PEPPERS = {1: "realworld-trial-not-a-secret-pepper-0123456789abcdefghijkl"}
          PY
              "$work/venv/bin/python" "$work/src/netbox/manage.py" migrate --no-input
              ;;
            wagtail)
              uv venv "$work/venv" -p 3.12
              uv pip install $pinned --python "$work/venv" wagtail==8.1 "psycopg[binary]"
              uv pip show --python "$work/venv" wagtail | head -2
              "$work/venv/bin/wagtail" start mysite
              cd mysite
              cat >> mysite/settings/dev.py <<'PY'

          # Wagtail's search backend uses PostgreSQL full-text fields on PostgreSQL
          INSTALLED_APPS += ["django.contrib.postgres"]

          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.postgresql",
                  "NAME": "project",
                  "USER": "postgres",
                  "PASSWORD": "pg",
                  "HOST": "localhost",
              }
          }
          PY
              "$work/venv/bin/python" manage.py migrate --no-input
              ;;
          esac
      - name: Check the schema
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          uv sync
          url=postgresql+pg8000://postgres:pg@localhost:5432/project
          # Prefect's own URL uses asyncpg: check through it, as a user would
          if [ "$PROJECT" = prefect ]; then url=postgresql+asyncpg://postgres:pg@localhost:5432/project; fi
          uv run --no-sync python scripts/realworld.py "$PROJECT" "$url" realworld-out
          # the same database through the read-only CLI, as against staging
          uv run --no-sync pghealth "$url" --no-config --enable all --warn \
            --json "realworld-out/$PROJECT.cli.json" | tail -n 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          if-no-files-found: ignore
          name: realworld-${{ matrix.project }}
          path: realworld-out/
